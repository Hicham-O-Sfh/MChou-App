<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<div data-screen="track" data-screen-label="10 Tracking" style="position:absolute;inset:0;background:#3A0B40">
<div ref="{{ trackMapRef }}" style="position:absolute;left:0;right:0;top:0;height:520px;z-index:0;background:#EDE3D6"></div>
<div style="position:absolute;top:56px;inset-inline:16px;z-index:2;display:flex;align-items:center;gap:10px">
<button type="button" onClick="{{ onTrackHome }}" aria-label="Retour" style="flex:none;width:48px;height:48px;border:0;padding:0;border-radius:50%;background:#3A0B40;box-shadow:0 0 0 1.5px rgba(255,216,77,.35),0 8px 16px -6px rgba(0,0,0,.5);display:grid;place-items:center;font:24px/1 'Material Symbols Rounded';font-variation-settings:'wght' 600;color:#FFF6E9;cursor:pointer"><span style="transform:scaleX({{ flip }})">arrow_back</span></button>
<span style="height:40px;padding:0 14px;display:flex;align-items:center;border-radius:999px;background:#3A0B40;box-shadow:0 0 0 1.5px rgba(255,216,77,.35),0 8px 16px -6px rgba(0,0,0,.5);font:700 14px/1 Nunito;color:#FFF6E9">Commande&nbsp;{{ cf.no }}</span>
<span style="flex:1"></span>
<button type="button" onClick="{{ onHelp }}" aria-label="Aide" style="flex:none;width:48px;height:48px;border:0;padding:0;border-radius:50%;background:#3A0B40;box-shadow:0 0 0 1.5px rgba(255,216,77,.35),0 8px 16px -6px rgba(0,0,0,.5);display:grid;place-items:center;font:24px/1 'Material Symbols Rounded';color:#FFD84D;cursor:pointer">help</button>
</div>
<div style="position:absolute;left:0;right:0;top:470px;bottom:0;z-index:3;padding:10px 20px 30px;border-radius:28px 28px 0 0;background:#3A0B40;box-shadow:0 -16px 30px -12px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:14px">
<span style="align-self:center;width:44px;height:5px;border-radius:9px;background:rgba(233,211,238,.4)"></span>
<div style="display:flex;align-items:center;gap:12px"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font:700 22px/26px Fredoka">{{ tk.title }}</span><span style="font:600 14px/20px Nunito;color:#E9D3EE">{{ tk.sub }}</span></div><sc-if value="{{ notDelivered }}" hint-placeholder-val="{{ true }}"><div style="flex:none;width:72px;height:64px;border-radius:20px;background:#24062A;box-shadow:0 0 0 2px #FFD84D,0 4px 0 2px #C98A12;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font:700 24px/26px Fredoka;color:#FFD84D;font-variant-numeric:tabular-nums">{{ tk.mins }}</span><span style="font:800 11px/14px Nunito;letter-spacing:.06em;color:#E9D3EE">MIN</span></div></sc-if></div>
<div style="position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))">
<div style="position:absolute;inset-inline:12.5%;top:19px;height:6px;border-radius:9px;background:rgba(0,0,0,.3)"><div style="width:{{ trkPct }};height:100%;border-radius:9px;background:#FFD84D;transition:width 400ms ease-out"></div></div>
<sc-for list="{{ steps4 }}" as="k" hint-placeholder-count="4"><div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="position:relative;width:44px;height:44px;border-radius:50%;background:{{ k.bg }};box-shadow:{{ k.ring }};display:grid;place-items:center;font:22px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1;color:{{ k.fg }};transition:background 300ms">{{ k.icon }}<sc-if value="{{ k.active }}" hint-placeholder-val="{{ false }}"><span data-pulse="1" style="position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 3px #FFD84D;pointer-events:none"></span></sc-if></span><span style="font:700 12px/16px Nunito;color:{{ k.lfg }}">{{ k.label }}</span></div></sc-for>
</div>
<sc-if value="{{ kitchen }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;background:#4E1256"><span data-spin="1" style="flex:none;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(160,86,10,.5) 0 3px,transparent 4px),radial-gradient(circle at 66% 62%,rgba(160,86,10,.45) 0 4px,transparent 5px),radial-gradient(circle at 60% 26%,rgba(160,86,10,.4) 0 2px,transparent 3px),radial-gradient(circle at 40% 40%,#F5C46A,#D98E34);box-shadow:0 0 0 3px #3A0B40"></span><span style="font:600 15px/20px Fredoka">On t'envoie le nom du livreur dès qu'il récupère ta commande.</span></div></sc-if>
<sc-if value="{{ driver }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:10px;border-radius:22px;background:#4E1256"><div style="flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;background:#6B2D8B;color:#FFF6E9"><image-slot id="driver-1" shape="circle" placeholder="Livreur"></image-slot></div><div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font:600 16px/20px Fredoka">Yassine</span><span style="font:600 13px/18px Nunito;color:#E9D3EE">Scooter · ★ 4,9</span></div><button type="button" onClick="{{ onChat }}" aria-label="Message" style="width:48px;height:48px;border:0;padding:0;border-radius:50%;background:rgba(0,0,0,.25);display:grid;place-items:center;font:22px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1;color:#FFF6E9;cursor:pointer">chat</button><button type="button" onClick="{{ onCall }}" aria-label="Appeler" style="width:48px;height:48px;border:0;padding:0;border-radius:50%;background:linear-gradient(#FFD36B,#F7B538);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 #C98A12;display:grid;place-items:center;font:22px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1;color:#3A0B40;cursor:pointer">call</button></div></sc-if>
<sc-if value="{{ delivered }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ onTrackHome }}" style="height:56px;display:flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:linear-gradient(#FFD36B,#F7B538);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #C98A12;font:600 17px/1 Fredoka;color:#3A0B40;cursor:pointer">Retour à l'accueil</button></sc-if>
<div style="display:flex;align-items:center;gap:10px;font:600 14px/20px Nunito;color:#E9D3EE"><span style="font:20px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1;color:#FFD84D">payments</span>{{ payNote }}</div>
</div>
</div>
</x-dc>
</body>
</html>
