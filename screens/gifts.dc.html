<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<div data-screen="gifts" data-screen-label="12 Gifts" style="position:absolute;inset:0;background:#3A0B40;display:flex;flex-direction:column">
<div style="position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,216,77,.09) 1px,transparent 1.6px),radial-gradient(circle,rgba(233,211,238,.07) 1.3px,transparent 2px);background-size:23px 23px,37px 37px;background-position:0 0,11px 17px;pointer-events:none"></div>
<div style="position:relative;display:flex;align-items:center;gap:12px;padding:58px 20px 8px">
<span style="flex:1;font:700 26px/32px Fredoka">Cadeaux</span>
<span style="display:flex;align-items:center;gap:6px;height:42px;padding-inline:6px 14px;border-radius:999px;background:#24062A;box-shadow:0 0 0 1.5px rgba(255,216,77,.35)"><span style="width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A0,#F7B538 60%,#C98A12);box-shadow:inset 0 0 0 2px rgba(201,138,18,.6);display:grid;place-items:center;font:700 14px/1 Fredoka;color:#3A0B40">M</span><span style="font:700 17px/1 Fredoka;color:#FFD84D;font-variant-numeric:tabular-nums">{{ miams }}</span></span>
</div>
<div style="position:relative;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:8px 20px 130px;display:flex;flex-direction:column;gap:14px">

<div style="display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:28px;background:#4E1256;box-shadow:0 0 0 1.5px rgba(255,216,77,.25)">
<span style="font:800 12px/16px Nunito;letter-spacing:.06em;text-transform:uppercase;color:#E9D3EE">Tes Miams</span>
<div style="display:flex;align-items:baseline;gap:8px"><span style="font:700 44px/48px Fredoka;color:#FFD84D;font-variant-numeric:tabular-nums">{{ miams }}</span><span style="font:600 18px/22px Fredoka">Miams</span><span style="flex:1"></span><span style="font:600 13px/18px Nunito;color:#C9A9D1">1 DH = 1 Miam</span></div>
<div style="height:14px;border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden"><div style="width:{{ rw.pct }};height:100%;border-radius:999px;background:linear-gradient(#FFD36B,#F7B538);box-shadow:inset 0 -3px 0 rgba(201,138,18,.45),inset 0 2px 0 rgba(255,255,255,.55);transition:width 600ms cubic-bezier(.22,1,.36,1)"></div></div>
<span style="font:600 14px/20px Nunito;color:#E9D3EE">{{ rw.msg }}</span>
</div>

<button type="button" onClick="{{ onStreak }}" style="display:flex;flex-direction:column;gap:10px;padding:16px 16px 10px;border:0;border-radius:28px;background:#4E1256;box-shadow:0 0 0 1.5px rgba(255,216,77,.25);color:#FFF6E9;text-align:start;cursor:pointer;transition:transform 420ms cubic-bezier(.34,1.56,.64,1)" style-active="transform:scale(.97);transition:transform 90ms ease-out">
<div style="align-self:stretch;display:flex;align-items:center;gap:12px"><span style="flex:none;display:flex;align-items:center;gap:4px;height:42px;padding-inline:10px 14px;border-radius:999px;background:#24062A;box-shadow:0 0 0 2px #FFD84D,0 4px 0 2px #C98A12"><span style="font:24px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1;color:#FF4D6D">local_fire_department</span><span style="font:700 17px/1 Fredoka;font-variant-numeric:tabular-nums">{{ streak }}</span></span><span style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font:600 16px/20px Fredoka;text-wrap:pretty">{{ fl.head }}</span><span style="font:600 13px/18px Nunito;color:#E9D3EE">Une commande par semaine, 5 semaines d'affilée</span></span><span style="flex:none;font:22px/1 'Material Symbols Rounded';color:#C9A9D1;transform:scaleX({{ flip }})">chevron_right</span></div>
<dc-import name="parts/flame" dcProps="{{ all }}"/>
</button>

<div style="display:flex;flex-direction:column;gap:2px;margin-top:8px"><span style="font:700 20px/26px Fredoka">Échange tes Miams</span><span style="font:600 14px/20px Nunito;color:#C9A9D1">Servis tels quels, comme sur la carte.</span></div>

<sc-for list="{{ gifts }}" as="g" hint-placeholder-count="4"><button type="button" onClick="{{ g.onOpen }}" style="display:flex;align-items:center;gap:12px;padding:10px;padding-inline-end:12px;border:0;border-radius:24px;background:#4E1256;box-shadow:0 0 0 1.5px rgba(255,216,77,.14);color:#FFF6E9;text-align:start;cursor:pointer;transition:transform 420ms cubic-bezier(.34,1.56,.64,1)" style-active="transform:scale(.97);transition:transform 90ms ease-out">
<div style="flex:none;width:72px;height:72px;border-radius:18px;overflow:hidden;background:{{ g.tint }};color:#3A0B40;opacity:{{ g.op }}"><image-slot id="{{ g.slot }}" shape="rounded" radius="18" placeholder="{{ g.name }}"></image-slot></div>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;opacity:{{ g.op }}"><span style="font:600 16px/20px Fredoka">{{ g.name }}</span><span style="font:600 13px/18px Nunito;color:#E9D3EE;text-wrap:pretty">{{ g.d }}</span><span style="margin-top:2px;font:700 15px/18px Fredoka;color:#FFD84D;font-variant-numeric:tabular-nums">{{ g.cost }} Miams</span></span>
<sc-if value="{{ g.ok }}" hint-placeholder-val="{{ true }}"><span style="flex:none;height:40px;padding:0 14px;display:flex;align-items:center;border-radius:999px;background:#24062A;box-shadow:0 0 0 1.5px #FFD84D;font:600 14px/1 Fredoka;color:#FFD84D">Échanger</span></sc-if>
<sc-if value="{{ g.lock }}" hint-placeholder-val="{{ false }}"><span style="flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;font:800 11px/14px Nunito;color:#C9A9D1;font-variant-numeric:tabular-nums"><span style="font:22px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1">lock</span>{{ g.need }}</span></sc-if>
</button></sc-for>

</div>
</div>
</x-dc>
</body>
</html>
