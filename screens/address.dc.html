<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<div data-screen="address" data-screen-label="04 Address" style="position:absolute;inset:0;background:#3A0B40;display:flex;flex-direction:column">
<div style="position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,216,77,.09) 1px,transparent 1.6px),radial-gradient(circle,rgba(233,211,238,.07) 1.3px,transparent 2px);background-size:23px 23px,37px 37px;background-position:0 0,11px 17px;pointer-events:none"></div>
<div style="position:relative;display:flex;align-items:center;gap:14px;padding:58px 20px 0">
<button type="button" onClick="{{ onBack }}" aria-label="Retour" style="flex:none;width:48px;height:48px;border:0;border-radius:50%;background:#4E1256;box-shadow:0 0 0 1.5px rgba(255,216,77,.3);display:grid;place-items:center;font:24px/1 'Material Symbols Rounded';font-variation-settings:'wght' 600;color:#FFF6E9;cursor:pointer"><span style="transform:scaleX({{ flip }})">arrow_back</span></button>
<sc-if value="{{ addrOnboard }}" hint-placeholder-val="{{ true }}"><div style="flex:1;display:flex;gap:6px"><span style="flex:1;height:8px;border-radius:9px;background:#FFD84D"></span><span style="flex:1;height:8px;border-radius:9px;background:#FFD84D"></span></div><span style="font:800 13px/16px Nunito;color:#E9D3EE">2/2</span></sc-if>
<sc-if value="{{ addrEditMode }}" hint-placeholder-val="{{ false }}"><span style="flex:1;font:700 22px/28px Fredoka">Adresse de livraison</span></sc-if>
</div>
<div style="position:relative;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:20px 20px 16px;display:flex;flex-direction:column;gap:14px">
<sc-if value="{{ addrOnboard }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:6px"><span style="font:700 26px/30px Fredoka">Où on t'apporte ça&nbsp;?</span><span style="font:500 16px/24px Nunito;color:#E9D3EE">Place le pin sur ta porte, on s'occupe du reste.</span></div></sc-if>
<div style="position:relative;flex:none;height:272px;border-radius:28px;overflow:hidden;background:#EDE3D6;box-shadow:0 0 0 1.5px rgba(255,216,77,.3),0 18px 30px -16px rgba(0,0,0,.8)">
<div ref="{{ addrMapRef }}" style="position:absolute;inset:0;z-index:0;background:#EDE3D6"></div>
<div style="position:absolute;left:50%;top:50%;width:0;height:0;z-index:2;pointer-events:none"><span style="position:absolute;left:-14px;top:-5px;width:28px;height:10px;border-radius:50%;background:rgba(36,6,42,.35)"></span><div data-pin="1" style="position:absolute;left:-22px;top:-56px;width:44px;height:56px"><span style="position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#6B2D8B;box-shadow:0 0 0 3px #FFD84D,0 8px 14px -4px rgba(0,0,0,.5)"></span><span style="position:absolute;left:0;top:0;width:44px;height:44px;display:grid;place-items:center;font:24px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1;color:#FFD84D">home</span></div></div>
<div style="position:absolute;inset-inline-start:12px;top:12px;z-index:2;display:flex;align-items:center;gap:6px;height:34px;padding-inline:8px 12px;border-radius:999px;background:{{ zoneBg }};font:800 12px/1 Nunito;color:{{ zoneFg }};pointer-events:none"><span style="font:20px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1">{{ zoneIcon }}</span>{{ zoneTxt }}</div>
<button type="button" onClick="{{ onLocate }}" aria-label="Ma position" style="position:absolute;inset-inline-end:12px;bottom:14px;z-index:2;width:48px;height:48px;border:0;border-radius:50%;background:#3A0B40;box-shadow:0 0 0 2px #FFD84D,0 8px 16px -6px rgba(0,0,0,.6);display:grid;place-items:center;font:24px/1 'Material Symbols Rounded';color:#FFD84D;cursor:pointer">my_location</button>
</div>
<div style="display:flex;align-items:center;gap:12px"><span style="flex:none;width:44px;height:44px;border-radius:14px;background:#4E1256;display:grid;place-items:center;font:24px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1;color:#FFD84D">location_on</span><span style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font:600 17px/22px Fredoka">{{ addrQ }}</span><span style="font:600 14px/20px Nunito;color:{{ distColor }}">{{ distTxt }}</span></span></div>
<label style="display:flex;flex-direction:column;gap:6px"><span style="font:700 14px/18px Nunito;color:#E9D3EE">Ton numéro&nbsp;? <span style="color:#C9A9D1">facultatif, mais conseillé</span></span>
<span style="display:flex;align-items:center;gap:10px;height:56px;padding-inline:6px 16px;border-radius:18px;background:#4E1256;box-shadow:{{ phoneRing }};transition:box-shadow 180ms ease-out"><span dir="ltr" style="height:44px;padding:0 12px;display:flex;align-items:center;border-radius:14px;background:rgba(0,0,0,.25);font:600 16px/1 Fredoka">+212</span><input type="tel" dir="ltr" value="{{ phoneFmt }}" onChange="{{ onPhone }}" onFocus="{{ onPhoneFocus }}" onBlur="{{ onPhoneBlur }}" placeholder="6 12 34 56 78" style="flex:1;min-width:0;height:44px;padding:0;border:0;outline:none;background:none;font:600 18px/1 Fredoka;letter-spacing:.04em;color:#FFF6E9"><sc-if value="{{ phoneOk }}" hint-placeholder-val="{{ false }}"><span style="font:24px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1;color:#8FCB6B">check_circle</span></sc-if></span>
</label>
<sc-if value="{{ phoneErr }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:6px;font:700 14px/20px Nunito;color:#FF6B85"><span style="font:20px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1">error</span>Un mobile marocain commence par 6 ou 7, avec 9 chiffres.</span></sc-if>
<sc-if value="{{ phoneEmpty }}" hint-placeholder-val="{{ true }}"><span style="font:600 14px/20px Nunito;color:#C9A9D1;text-wrap:pretty">Pour que le livreur puisse vous contacter.</span></sc-if>
</div>
<div style="position:relative;padding:12px 20px 40px">
<sc-if value="{{ addrOk }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ onAddrSave }}" style="width:100%;height:56px;display:flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:linear-gradient(#FFD36B,#F7B538);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #C98A12;font:600 17px/1 Fredoka;color:#3A0B40;cursor:pointer;transition:transform 420ms cubic-bezier(.34,1.56,.64,1)" style-active="transform:translateY(3px) scale(.95);transition:transform 90ms ease-out">{{ addrCta }}</button></sc-if>
<sc-if value="{{ addrNotOk }}" hint-placeholder-val="{{ true }}"><div style="height:56px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:rgba(255,255,255,.08);font:600 17px/1 Fredoka;color:#C9A9D1">{{ addrCtaOff }}</div></sc-if>
</div>
</div>
</x-dc>
</body>
</html>
