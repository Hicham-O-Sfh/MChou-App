<!DOCTYPE html>
<html>
<head>

</head>
<body>
<x-dc>

<div dir="ltr" style="position:absolute;left:0;right:0;top:0;height:470px">
<div style="position:absolute;left:24px;top:78px;width:168px;height:206px;border-radius:26px;padding:5px;box-sizing:border-box;background:#FFF6E9;transform:rotate(-7deg);box-shadow:0 18px 30px -14px rgba(0,0,0,.75)"><div style="width:100%;height:100%;border-radius:21px;overflow:hidden;background:#F7C873;color:#3A0B40"><image-slot id="login-1" shape="rounded" radius="21" placeholder="Crêpe Nutella banane"></image-slot></div></div>
<div style="position:absolute;left:204px;top:64px;width:160px;height:170px;border-radius:26px;padding:5px;box-sizing:border-box;background:#FFF6E9;transform:rotate(6deg);box-shadow:0 18px 30px -14px rgba(0,0,0,.75)"><div style="width:100%;height:100%;border-radius:21px;overflow:hidden;background:#FFB3C1;color:#3A0B40"><image-slot id="login-2" shape="rounded" radius="21" placeholder="Mojito fraise"></image-slot></div></div>
<div style="position:absolute;left:36px;top:300px;width:152px;height:140px;border-radius:26px;padding:5px;box-sizing:border-box;background:#FFF6E9;transform:rotate(5deg);box-shadow:0 18px 30px -14px rgba(0,0,0,.75)"><div style="width:100%;height:100%;border-radius:21px;overflow:hidden;background:#BFE3A5;color:#3A0B40"><image-slot id="login-3" shape="rounded" radius="21" placeholder="Brownie pistache"></image-slot></div></div>
<div style="position:absolute;left:206px;top:252px;width:156px;height:184px;border-radius:26px;padding:5px;box-sizing:border-box;background:#FFF6E9;transform:rotate(-5deg);box-shadow:0 18px 30px -14px rgba(0,0,0,.75)"><div style="width:100%;height:100%;border-radius:21px;overflow:hidden;background:#F3D9B8;color:#3A0B40"><image-slot id="login-4" shape="rounded" radius="21" placeholder="Choux"></image-slot></div></div>
<img src="assets/mchou-logo.png" alt="" style="position:absolute;left:146px;top:220px;width:98px;height:98px;border-radius:50%;transform:rotate(-8deg);box-shadow:0 0 0 5px #3A0B40,0 16px 26px -10px rgba(0,0,0,.7);pointer-events:none">
<span style="position:absolute;left:182px;top:42px;width:12px;height:12px;border-radius:50%;background:#8FCB6B;box-shadow:0 2px 0 #3E7A22"></span><span style="position:absolute;left:18px;top:296px;width:10px;height:10px;border-radius:50%;background:#FF4D6D;box-shadow:0 2px 0 #E0284B"></span><span style="position:absolute;left:356px;top:246px;width:10px;height:10px;border-radius:50%;background:#FFD84D;box-shadow:0 2px 0 #C98A12"></span>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:40px 24px 34px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(rgba(58,11,64,0),#3A0B40 40px)">
<div style="display:flex;flex-direction:column;gap:2px"><span style="font:700 32px/36px Fredoka;color:#FFF6E9">Bienvenue chez M'Chou</span><span style="font:400 22px/34px Pacifico;color:#FFD84D">crêpes, choux &amp; brownies</span></div>
<span style="font:500 16px/24px Nunito;color:#E9D3EE;text-wrap:pretty">Livrés tout chauds partout à Oujda. Chaque dirham dépensé te rapporte un Miam.</span>
<div style="display:flex;flex-direction:column;gap:12px;margin-top:6px">

<button type="button" onClick="{{ onPhoneLogin }}" style="height:52px;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;background:none;box-shadow:inset 0 0 0 1.5px rgba(233,211,238,.45);font:600 16px/1 Fredoka;color:#FFF6E9;cursor:pointer"><span style="font:22px/1 'Material Symbols Rounded';color:#FFD84D">call</span>Continuer avec mon numéro</button>
</div>
<span style="font:600 12px/17px Nunito;color:#C9A9D1;text-align:center;text-wrap:pretty">En continuant, tu acceptes nos <span style="color:#E9D3EE;text-decoration:underline">Conditions</span> et notre <span style="color:#E9D3EE;text-decoration:underline">Politique de confidentialité</span>.</span>
</div>
</div>

</body>
</html>
