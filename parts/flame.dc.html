<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<div data-flame-line="1" style="position:relative;align-self:stretch;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-top:2px">
<span style="position:absolute;inset-inline:10%;top:26px;height:4px;border-radius:9px;background:rgba(233,211,238,.18)"></span>
<span style="position:absolute;inset-inline-start:10%;top:26px;width:{{ fl.fill }};height:4px;border-radius:9px;background:#FFD84D;transition:width 600ms cubic-bezier(.22,1,.36,1)"></span>
<sc-for list="{{ fl.nodes }}" as="n" hint-placeholder-count="5"><div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:6px">
<span style="height:52px;display:grid;place-items:center"><span style="width:{{ n.size }}px;height:{{ n.size }}px;box-sizing:border-box;border-radius:50%;border:{{ n.bd }};background:{{ n.bg }};display:grid;place-items:center;font:24px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1;color:{{ n.ic }}">{{ n.icon }}</span></span>
<span style="min-height:14px;font:800 11px/14px Nunito;letter-spacing:.02em;color:{{ n.capFg }};white-space:nowrap">{{ n.cap }}</span>
</div></sc-for>
</div>
</x-dc>
</body>
</html>
