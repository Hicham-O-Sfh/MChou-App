<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;z-index:45">
<div data-scrim="1" onClick="{{ onCloseSheet }}" style="position:absolute;inset:0;background:rgba(18,2,21,.6)"></div>
<div data-panel="1" style="position:absolute;left:0;right:0;bottom:0;padding:10px 24px 36px;border-radius:28px 28px 0 0;background:#4E1256;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
<span style="width:44px;height:5px;border-radius:9px;background:rgba(233,211,238,.4)"></span>
<div data-gift-thumb="1" style="margin-top:6px;width:132px;height:132px;border-radius:28px;overflow:hidden;background:{{ gs.tint }};color:#3A0B40;box-shadow:0 0 0 3px #FFD84D,0 6px 0 3px #C98A12"><image-slot id="{{ gs.slot }}" shape="rounded" radius="28" placeholder="{{ gs.name }}"></image-slot></div>
<span style="margin-top:6px;font:700 24px/30px Fredoka">{{ gs.name }}</span>
<span style="max-width:300px;font:500 16px/24px Nunito;color:#E9D3EE;text-wrap:pretty">{{ gs.d }}</span>
<span style="display:flex;align-items:flex-start;gap:8px;align-self:stretch;padding:10px 14px;border-radius:16px;background:rgba(0,0,0,.22);font:600 14px/20px Nunito;color:#E9D3EE;text-align:start;text-wrap:pretty"><span style="flex:none;font:20px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1;color:#FFD84D">redeem</span><span>{{ gs.items }}Servi tel quel, sans personnalisation.</span></span>
<div style="align-self:stretch;display:flex;align-items:center;gap:10px;padding:4px 2px"><span style="flex:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A0,#F7B538 60%,#C98A12);box-shadow:inset 0 0 0 2px rgba(201,138,18,.6);display:grid;place-items:center;font:700 14px/1 Fredoka;color:#3A0B40">M</span><span style="flex:1;font:700 20px/24px Fredoka;color:#FFD84D;text-align:start;font-variant-numeric:tabular-nums">{{ gs.cost }} Miams</span><span style="font:700 13px/16px Nunito;color:#E9D3EE">{{ gs.left }}</span></div>
<sc-if value="{{ gs.ok }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ onRedeem }}" style="align-self:stretch;height:56px;border:0;border-radius:999px;background:linear-gradient(#FFD36B,#F7B538);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #C98A12;font:600 17px/1 Fredoka;color:#3A0B40;cursor:pointer;transition:transform 420ms cubic-bezier(.34,1.56,.64,1)" style-active="transform:translateY(3px) scale(.95);transition:transform 90ms ease-out">Je me l'offre&nbsp;!</button></sc-if>
<sc-if value="{{ gs.lock }}" hint-placeholder-val="{{ false }}"><div style="align-self:stretch;height:56px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;background:rgba(255,255,255,.08);font:600 17px/1 Fredoka;color:#C9A9D1"><span style="font:22px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1">lock</span>{{ gs.need }}</div></sc-if>
<button type="button" onClick="{{ onCloseSheet }}" style="height:48px;padding:0 16px;border:0;background:none;font:700 15px/1 Nunito;color:#E9D3EE;cursor:pointer">Pas maintenant</button>
</div>
</div>
</x-dc>
</body>
</html>
